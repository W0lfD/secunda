name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.11.27
          python-version: 3.12.12
      - name: Create disposable local configuration
        run: |
          python - <<'PY'
          import os
          import secrets
          from pathlib import Path
          os.umask(0o077)
          config = Path('.env.example').read_text()
          for name in ('POSTGRES_PASSWORD', 'RABBITMQ_PASSWORD', 'PAYMENT_API_KEY'):
              config = config.replace(f'{name}=\n', f'{name}={secrets.token_hex(32)}\n')
          with open('.env', 'x') as output:
              output.write(config)
          PY
      - run: make sync format lint typecheck audit
      - run: make unit integration smoke
      - name: Collect service logs on failure
        if: failure()
        run: make logs || true
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore

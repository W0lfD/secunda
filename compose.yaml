x-payment-environment: &payment-environment
  PAYMENT_API_KEY: ${PAYMENT_API_KEY:?Set PAYMENT_API_KEY in .env}
  PAYMENT_DATABASE_URL: ${PAYMENT_DATABASE_URL:?Set PAYMENT_DATABASE_URL in .env}
  PAYMENT_RABBITMQ_URL: ${PAYMENT_RABBITMQ_URL:?Set PAYMENT_RABBITMQ_URL in .env}
  PAYMENT_WEBHOOK_ALLOWED_ORIGINS: '${PAYMENT_WEBHOOK_ALLOWED_ORIGINS:-["http://callback:8080"]}'

services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    hostname: rabbitmq
    image: rabbitmq:4.2.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:${RABBIT_PORT:-5673}:5672"
      - "127.0.0.1:${RABBIT_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    environment: *payment-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment: *payment-environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os,urllib.request; urllib.request.urlopen(urllib.request.Request(\"http://localhost:8000/ready\", headers={\"X-API-Key\":os.environ[\"PAYMENT_API_KEY\"]}))'"]
      interval: 5s
      timeout: 3s
      retries: 20

  consumer:
    build: .
    environment: *payment-environment
    command: ["python", "-m", "payment_service.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  callback:
    build: .
    command: ["python", "tools/callback.py"]
    profiles: ["demo", "test"]
    ports:
      - "127.0.0.1:${CALLBACK_PORT:-8080}:8080"

volumes:
  postgres_data:
  rabbitmq_data:
